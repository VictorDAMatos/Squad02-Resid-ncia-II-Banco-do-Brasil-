<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BB — Banco do Brasil | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bb-blue:   #002776;
      --bb-mid:    #003d99;
      --bb-light:  #0050c8;
      --bb-yellow: #F8C200;
      --bb-yellow-dark: #d4a500;
      --surface:   #ffffff;
      --bg:        #f0f3f9;
      --text:      #1a1f2e;
      --muted:     #6b7a99;
      --border:    #dde3f0;
      --error:     #c0392b;
      --error-bg:  #fdecea;
      --radius:    12px;
      --shadow:    0 8px 32px rgba(0,39,118,0.14);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Sora', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 10% 20%, rgba(0,39,118,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 90% 80%, rgba(248,194,0,0.10) 0%, transparent 60%);
      z-index: 0;
    }
    .login-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 20px;
      animation: fadeUp 0.5s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card {
      background: var(--surface);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 40px 36px 36px;
      border: 1px solid var(--border);
    }
    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
    .logo-emblem { display: flex; align-items: center; }
    .bb-circle { width: 24px; height: 24px; border-radius: 50%; }
    .bb-blue-c   { background: var(--bb-blue); }
    .bb-yellow-c { background: var(--bb-yellow); margin-left: -9px; }
    .logo-texts { display: flex; flex-direction: column; line-height: 1; }
    .logo-bb { font-size: 18px; font-weight: 700; color: var(--bb-blue); letter-spacing: 1px; }
    .logo-name { font-size: 10px; font-weight: 500; color: var(--muted); letter-spacing: 0.5px; }
    .card-title { font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .card-sub { font-size: 13px; color: var(--muted); margin-bottom: 28px; }
    .profile-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 24px; }
    .profile-btn {
      border: 2px solid var(--border);
      background: var(--bg);
      border-radius: var(--radius);
      padding: 14px 10px;
      cursor: pointer;
      text-align: center;
      transition: all 0.18s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .profile-btn:hover { border-color: var(--bb-light); background: #f0f5ff; }
    .profile-btn.active { border-color: var(--bb-blue); background: #eef2ff; }
    .profile-btn svg { width: 22px; height: 22px; color: var(--bb-blue); }
    .profile-btn span { font-size: 12px; font-weight: 600; color: var(--text); }
    .profile-btn small { font-size: 10px; color: var(--muted); }
    .field { margin-bottom: 16px; }
    .field label {
      display: block; font-size: 12px; font-weight: 600;
      color: var(--muted); margin-bottom: 6px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .field input {
      width: 100%; padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      font-family: 'Sora', sans-serif;
      font-size: 14px; color: var(--text);
      background: var(--bg); outline: none;
      transition: border-color 0.18s;
    }
    .field input:focus { border-color: var(--bb-blue); background: #fff; }
    .hint-box {
      background: #f0f5ff; border: 1px solid #c5d5f5;
      border-radius: var(--radius); padding: 12px 14px;
      margin-bottom: 20px; font-size: 12px; color: var(--bb-blue);
    }
    .hint-box strong { display: block; margin-bottom: 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
    .hint-row { display: flex; justify-content: space-between; margin-top: 3px; }
    .hint-row span { color: var(--muted); }
    .hint-row code { font-family: monospace; font-weight: 600; color: var(--bb-blue); }
    .error-msg {
      background: var(--error-bg); color: var(--error);
      border-radius: var(--radius); padding: 10px 14px;
      font-size: 13px; margin-bottom: 16px; display: none;
    }
    .error-msg.show { display: block; }
    .btn-login {
      width: 100%; padding: 14px;
      background: var(--bb-blue); color: #fff;
      border: none; border-radius: var(--radius);
      font-family: 'Sora', sans-serif;
      font-size: 15px; font-weight: 600; cursor: pointer;
      transition: background 0.18s, transform 0.1s;
    }
    .btn-login:hover   { background: var(--bb-mid); }
    .btn-login:active  { transform: scale(0.98); }
    .btn-login.loading { pointer-events: none; opacity: 0.8; }
    .card-footer { text-align: center; margin-top: 20px; font-size: 11px; color: var(--muted); }
    .card-footer span {
      display: inline-block; background: var(--bb-yellow);
      color: var(--bb-blue); border-radius: 4px;
      padding: 1px 6px; font-weight: 700; font-size: 10px; margin-right: 4px;
    }
  </style>
</head>
<body>
<div class="login-wrapper">
  <div class="card">
    <div class="logo">
      <div class="logo-emblem">
        <div class="bb-circle bb-blue-c"></div>
        <div class="bb-circle bb-yellow-c"></div>
      </div>
      <div class="logo-texts">
        <span class="logo-bb">BB</span>
        <span class="logo-name">Banco do Brasil</span>
      </div>
    </div>
    <h1 class="card-title">Bem-vindo</h1>
    <p class="card-sub">Selecione seu perfil e faca login.</p>
    <div class="profile-selector">
      <button class="profile-btn active" id="btn-usuario" onclick="selectPerfil('usuario')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>Usuario</span>
        <small>Internet Banking</small>
      </button>
      <button class="profile-btn" id="btn-analista" onclick="selectPerfil('analista')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="3" width="20" height="14" rx="2"/>
          <path d="M8 21h8M12 17v4"/>
          <path d="M7 8h.01M11 8h6M7 12h.01M11 12h6"/>
        </svg>
        <span>Analista</span>
        <small>Painel Interno</small>
      </button>
    </div>
    <div class="hint-box">
      <strong>Credenciais de demonstracao</strong>
      <div class="hint-row"><span>Usuario:</span> <code id="hint-user">julia.andrade</code></div>
      <div class="hint-row"><span>Senha:</span> <code>bb2025</code></div>
    </div>
    <div class="error-msg" id="errorMsg">Usuario ou senha incorretos.</div>
    <div class="field">
      <label>Usuario / CPF</label>
      <input type="text" id="inputUser" placeholder="Digite seu usuario" autocomplete="username" />
    </div>
    <div class="field">
      <label>Senha</label>
      <input type="password" id="inputPass" placeholder="..." autocomplete="current-password" />
    </div>
    <button class="btn-login" id="btnLogin" onclick="doLogin()">Entrar</button>
    <div class="card-footer">
      <span>BB</span> Internet Banking - Ambiente de demonstracao
    </div>
  </div>
</div>
<script>
  const CREDENCIAIS = {
    usuario:  { user: 'julia.andrade', pass: 'bb2025', redirect: 'usuario/index.html' },
    analista: { user: 'analista.bb',   pass: 'bb2025', redirect: 'analista/dashboard.html' },
  };
  let perfilAtivo = 'usuario';
  function selectPerfil(perfil) {
    perfilAtivo = perfil;
    document.getElementById('btn-usuario').classList.toggle('active', perfil === 'usuario');
    document.getElementById('btn-analista').classList.toggle('active', perfil === 'analista');
    document.getElementById('hint-user').textContent = CREDENCIAIS[perfil].user;
    document.getElementById('errorMsg').classList.remove('show');
  }
  function doLogin() {
    const user = document.getElementById('inputUser').value.trim();
    const pass = document.getElementById('inputPass').value.trim();
    const cred = CREDENCIAIS[perfilAtivo];
    const btn  = document.getElementById('btnLogin');
    const err  = document.getElementById('errorMsg');
    err.classList.remove('show');
    if (!user || !pass) {
      err.textContent = 'Preencha usuario e senha.';
      err.classList.add('show');
      return;
    }
    if (user !== cred.user || pass !== cred.pass) {
      err.textContent = 'Usuario ou senha incorretos.';
      err.classList.add('show');
      document.getElementById('inputPass').value = '';
      return;
    }
    btn.textContent = 'Entrando...';
    btn.classList.add('loading');
    setTimeout(() => { window.location.href = cred.redirect; }, 800);
  }
  document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
