<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dashboard do Analista - Motor de Fraudes</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #2c3e50; color: white; }
        .alerta { background-color: #e74c3c; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .registro { background-color: #34495e; padding: 10px; margin: 10px 0; border-left: 4px solid #3498db; border-radius: 5px; }
        .registro strong { color: #f1c40f; }
        .acoes { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0; }
        .painel { margin-top: 20px; }
        button { background-color: #3498db; color: white; border: none; padding: 10px 20px; cursor: pointer; font-size: 16px; border-radius: 4px; }
        button:hover { background-color: #2980b9; }
        small { color: #bdc3c7; }
    </style>
</head>
<body>
    <h1>🛡️ Central de Inteligência - Detecção de Fraudes</h1>
    <p>Painel de monitorização de anomalias, logs operacionais e auditoria das ações do analista.</p>
    <small>Identificação do analista enviada via cabeçalhos X-Analista-ID e X-Analista-Nome.</small>

    <div class="acoes">
        <button onclick="buscarAnomalias()">🔍 Verificar Transações Suspeitas</button>
        <button onclick="buscarLogs()">📋 Ver Histórico de Logs</button>
        <button onclick="buscarAuditoria()">🧾 Ver Auditoria</button>
        <button onclick="trocarAnalista()">👤 Trocar Analista</button>
    </div>

    <div id="painel-alertas" class="painel"></div>
    <div id="painel-logs" class="painel"></div>
    <div id="painel-auditoria" class="painel"></div>

    <script src="js/api_analista.js"></script>
</body>
</html>
